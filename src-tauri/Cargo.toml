[package]
name = "database4every1"
version = "0.2.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "db_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "mysql",
  "chrono",
  "json",
  "rust_decimal",
  "uuid",
] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
uuid = { version = "1", features = ["serde"] }
base64 = "0.22"
mongodb = "3.8"
elasticsearch = { version = "9.1.0-alpha.1", default-features = false, features = ["rustls-tls"] }
url = "2"
ssh2 = "0.9.6"
dirs = "6"
redis = { version = "1.5.0", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure"] }
shell-words = "1.1.1"
