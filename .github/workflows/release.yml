name: Release desktop installers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare or create release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create/update release PR or create release after it is merged
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-installers:
    name: Build ${{ matrix.name }}
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    needs: release-please
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon DMG
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel DMG
            platform: macos-15-intel
            rust_targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - name: Linux x64 AppImage, DEB and RPM
            platform: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb,rpm
          - name: Windows x64 EXE and MSI
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: --bundles nsis,msi

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out released revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rpm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc signing prevents unsigned Apple Silicon apps from being
          # reported as damaged. Replace this with Apple signing secrets when
          # distributing a notarized production build.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseName: Database4every1 v${{ needs.release-please.outputs.version }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
